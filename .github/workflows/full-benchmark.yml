name: Full benchmark

on:
  schedule:
    - cron: "17 8 1 * *"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dataset:
        description: "Benchmark dataset: v3 (DISAI_Conta 5.5 lineup, Spanish) or v2 (previous Sonnet 5 / Haiku 4.5 arms)"
        type: choice
        options: [v3, v2]
        default: v3

permissions:
  contents: read

jobs:
  benchmark:
    environment: full-benchmark
    runs-on: ubuntu-latest
    # v3 is 900 jobs on thinking models; GitHub-hosted runners stop jobs at 360 minutes.
    timeout-minutes: ${{ (inputs.dataset || 'v3') == 'v3' && 360 || 120 }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATASET: ${{ inputs.dataset || 'v3' }}
      MAX_EXPERIMENT_COST_USD: ${{ (inputs.dataset || 'v3') == 'v3' && '40' || '25' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm benchmark --config config/full.$DATASET.json
      - run: pnpm report --raw runs/results.jsonl --output reports/generated --config config/full.$DATASET.json --events runs/events.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-benchmark-${{ inputs.dataset || 'v3' }}-${{ github.sha }}
          path: |
            runs/
            reports/generated/
          if-no-files-found: warn
          retention-days: 90
