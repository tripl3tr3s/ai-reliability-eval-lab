name: Trusted live smoke

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Smoke dataset: v3 (current) or v2"
        type: choice
        options: [v3, v2]
        default: v3
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'live-smoke'))
    environment: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MAX_EXPERIMENT_COST_USD: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm benchmark --config config/smoke.${{ inputs.dataset || 'v3' }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-smoke-${{ inputs.dataset || 'v3' }}-${{ github.sha }}
          path: runs/
          if-no-files-found: warn
          retention-days: 30
